homeserver:
  url: "http://synapse:8008"
  domain: "example.net"
danbooru:
  url: "http://danbooru:3000"
  # Dedicated Danbooru bot account and its API key (keep the real key out of git)
  username: "tunnel"
  api_key: "YOUR_DANBOORU_API_KEY"
autotagger:
  # fourier-spectrum autotagger service (image bytes in, Danbooru tags out).
  url: "http://fourier-spectrum:5000"
  # Confidence cutoffs for the general and character tag buckets.
  general_threshold: 0.35
  character_threshold: 0.75
  # Per-image request timeout (ms); on timeout/error the post is created untagged.
  timeout_ms: 20000
bridge:
  port: 8009
  # Rooms where tagging is disabled (room IDs)
  disabled_rooms: []
  # Minimum power level required to edit tags (enforced by your Matrix client)
  tag_edit_power_level: 25
  # Default rating for auto-created posts: g (general), s (sensitive), q (questionable), e (explicit)
  default_rating: "q"
  # Whether to run the tagging pipeline on images posted in DMs (2-member rooms)
  tag_in_dms: false
  # Bot admins. `admins` is the name going forward and covers every admin DM
  # command (!resetstrikes, !setavatar, !listrooms). strike_reset_admins is the
  # older name for the same list and is still read as a fallback, so existing
  # deployments keep working untouched.
  admins:
    - "@admin:example.net"
  # Deprecated alias for `admins`, kept so old configs do not break.
  strike_reset_admins:
    - "@admin:example.net"
  # Power level required in a room to invite the bot
  invite_power_level: 100
  # The BRIDGE bot's display name (@tunnel stays the tunnel).
  display_name: "Fourier"
  # Fourier-chan is NOT configured here. Since 2026-09-25 she is her own
  # service on the bot hub (fourier-basis ops/hetzner/guide) with her own
  # registration: onboarding, the !join on-ramp and !bugreport moved with her,
  # and her keys (onramp_room, onboarding, bugreport, the admin token) with them.

# Tonneru-chan in Discord (operator rulings 2026-10-04). Absent or
# enabled: false, nothing Discord runs. The token is DISCORD_BOT_TOKEN in .env,
# never here. state_dir is shared with fourier-sampling's panel (FS_DISCORD_DIR
# there): mount /var/lib/fourier-tunnel/discord at /discord in compose.
# discord:
#   enabled: true
#   state_dir: /discord
#   guilds:                       # guild id: creator prefix (never 41chan or 4chan)
#     "123456789012345678": aichan
#   index_every_minutes: 5        # the panel's "refresh now" also runs one within seconds
#   acquire_every_seconds: 120
#   speak_every_seconds: 3
#   start_from: beginning         # a target's whole history; "now" for new posts only
#   presence: true
