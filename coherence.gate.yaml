# How this repo is gated, declared by the repo itself.
#
# `coherence gate` reads this. It lives HERE and not in a machine column
# because the gate command is a fact about the repo, and a column describes
# one machine -- there are three, hand-maintained, and nothing compares them.
# Declared here, it travels to every box because it is the repo.
#
#   gate    the class B command: this repo's own toolchain. `class-a-only`
#           states there is none, and coherence VERIFIES that claim.
#   suite   the command whose run reports the test count (WORKING-RULES
#           rule 6), quoted back in a derived-facts denial.
#   exclude paths held out of the confusable check: vendored or upstream
#           content that is not ours to normalize.
# This repo declared `class-a-only` -- "Docker and infrastructure, no toolchain
# to run" -- and coherence answered "no class B surface (verified)" for months
# while eight *.test.js files and 82 passing tests were never run by any gate,
# the fibonacci point system's among them. The claim was false, and the word
# VERIFIED was what made it dangerous.
#
# It survived because coherence looked for Node only in package.json SCRIPTS,
# and `node --test` needs no script: it discovers test files by NAME. The probe
# now knows that rule, and its regression test is
# test_a_node_repo_cannot_declare_class_a_only.

# LINT RUNS FIRST, and it is in the gate rather than beside it.
#
# 2026-09-13: `await sleep(750)` shipped and ran for weeks. `sleep` was never
# defined -- it threw ReferenceError on every backfilled image, AFTER the image
# had been uploaded and tagged, so 266 successful pictures reported "0 done, 266
# failed" and the pacing that line existed to provide never happened. No test
# reaches that line without a live homeserver. eslint's no-undef reads it off
# the page.
#
# Chained with &&, so a lint failure stops the run rather than being scrolled
# past. fourier-sampling has had eslint for months, ungated, and it rotted to 22
# errors that every session wrote off as somebody else's business -- memory
# `lint-was-ungated-and-rotted`. A check nothing runs is not a check.
# --no-install ON PURPOSE: the linter must be the one this repo pins, never one
# npx fetches at gate time, and a missing toolchain must say so rather than
# silently resolving to whatever is newest. That makes `npm install` (WITH
# devDependencies) a precondition for gating a checkout -- the Docker image is
# unaffected, it builds its own tree with --omit=dev and never copies this one.
gate: npx --no-install eslint . && node --test
suite: node --test
