name: fourier-tunnel
services:
  tunnel:
    build: .
    # container_name is load-bearing, not cosmetic: Synapse resolves the bridge
    # by the hostname in the registration's `url`, so this name and
    # `url: http://fourier-tunnel:8009` must agree.
    container_name: fourier-tunnel
    env_file:
      - .env
    environment:
      # What must survive a rebuild -- the invite-strike ledger, the audit log,
      # the denied-room list -- lives on a MOUNTED path. (It held Fourier-chan's
      # onboarding watermark too, until she moved to her own service.)
      ONBOARDING_STATE_DIR: /state
    volumes:
      # config.yaml is also COPYed into the image by the Dockerfile; this mount
      # takes precedence, so editing it on the host is enough. Without the
      # mount, an edit here silently did nothing until the next `--build`,
      # which is how a config change that looked applied was not.
      - ./config.yaml:/app/config.yaml:ro
      - ./onboarding-state:/state
      # Tonneru-chan's Discord state (config.yaml discord.state_dir: /discord),
      # SHARED with fourier-sampling's panel (FS_DISCORD_DIR in fourier-web).
      # Created once on the host before this mount is used -- docker would
      # otherwise make it root-only and the panel could not write its files:
      #   install -d -m 2775 -o root -g fourier /var/lib/fourier-tunnel/discord
      - /var/lib/fourier-tunnel/discord:/discord
    restart: unless-stopped
    # THE JOURNAL, NOT json-file. The daemon default on 41chan is json-file
    # 50m x 3 (measured 2026-11-01), bounded by size and not by age, and the
    # operator's ruling of 2026-11-01 is that anyone's IP address or user
    # agent lives at most 7 days in EVERY store, logs included. This bridge
    # logs errors whose text it did not write -- a fetch failure, a booru or
    # proxy error page -- and the room-message guard (chat-words.js) sends
    # their detail here on purpose. journald on the box keeps 6 days, so what
    # lands in stdout ages out with everything else. `docker logs` still reads it.
    logging:
      driver: journald
      options:
        tag: fourier-tunnel
    networks:
      - synapse_default
      - danbooru_default
    # No ports published to host -- Synapse reaches it internally on 8009
networks:
  synapse_default:
    external: true
  danbooru_default:
    external: true
